[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "model-audit"
version = "1.0.0"
description = "A comprehensive ML model evaluation library that goes far beyond accuracy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.optional-dependencies]
reports = ["matplotlib>=3.7", "jinja2>=3.1"]
all = ["model-audit[reports]"]

[project.scripts]
model-audit = "model_audit.cli:main"
