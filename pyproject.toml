[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-critic"
version = "3.3.0"
description = "Graph-based evaluation engine for machine learning models"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
    { name = "Luiz Filipe Seabra" }
]

dependencies = [
    "numpy",
    "scikit-learn"
]

dynamic = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_critic*"]